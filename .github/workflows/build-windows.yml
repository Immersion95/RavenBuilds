name: Eden Windows x64
run-name: Eden Windows x64 - ${{ inputs.source_branch }} - ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Forgejo source branch (master, fix/* or test/*)
        required: true
        type: string
        default: master
      source_sha:
        description: Exact 40-character Forgejo commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch and verify source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:SOURCE_BRANCH -cnotmatch '^(master|(?:fix|test)/[a-zA-Z0-9][a-zA-Z0-9._/-]*)$') { throw 'Unsupported source branch.' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'A full Git commit SHA is required.' }
          git check-ref-format --branch $env:SOURCE_BRANCH
          git init eden
          git -C eden remote add origin https://git.eden-emu.dev/Immersion95/eden.git
          git -C eden fetch --no-tags --depth=1 origin "refs/heads/$env:SOURCE_BRANCH"
          $actual = (git -C eden rev-parse FETCH_HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Branch tip changed: expected $env:SOURCE_SHA, found $actual. Dispatch again with the intended SHA." }
          git -C eden checkout --detach $actual
          git -C eden submodule update --init --recursive
          git -C eden log -1 --oneline

      - name: Install CMake and Ninja
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'cmake>=4.4,<5' ninja
          $cmakeBin = (python -c "import cmake; print(cmake.CMAKE_BIN_DIR)").Trim()
          $ninjaBin = (python -c "import ninja; print(ninja.BIN_DIR)").Trim()
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $ninjaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Vulkan SDK
        working-directory: eden
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\windows\install-vulkan-sdk.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = 'C:\VulkanSDK\1.4.341.1'
          if (!(Test-Path "$sdk\Bin\glslangValidator.exe")) { throw 'Vulkan SDK installation not found.' }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure and build Eden
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . .\tools\windows\load-msvc-env.ps1
          clang-cl --version
          cmake --version
          ninja --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DYUZU_USE_BUNDLED_QT=ON -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DDYNARMIC_TESTS=OFF
          cmake --build build --parallel 2
          if (!(Test-Path 'build/bin/eden.exe')) { throw 'eden.exe was not produced.' }
          @("Source repository: https://git.eden-emu.dev/Immersion95/eden", "Source commit: $(git rev-parse HEAD)", 'Target: Windows x64 Release', 'Compiler: clang-cl') | Set-Content -Encoding utf8 build/bin/BUILD_INFO.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Windows-x64-${{ inputs.source_sha }}
          path: eden/build/bin/
          if-no-files-found: error
          retention-days: 7
